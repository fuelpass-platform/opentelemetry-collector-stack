receivers:
  otlp:
    protocols:
      grpc:
      http:
        cors:
          allowed_origins:
            - "${ALLOWED_ORIGIN}"
          allowed_headers:
            - "Content-Type"
            - "grpc-encoding"
          max_age: 7200
  # FD-1555: probes Flagsmith's public URL from outside Railway's private network, the way
  # clients reach it. The production outage was that URL failing while the services were up.
  httpcheck/flagsmith:
    targets:
      - endpoint: "${FLAGSMITH_HEALTH_URL}"
        method: GET
    collection_interval: 60s
exporters:
  otlphttp/default:
    endpoint: "${HONEYCOMB_ENDPOINT}"
    headers:
      "signoz-ingestion-key": "${GENERAL_AUTH_TOKEN}"
    tls:
      insecure: false
  debug:
    verbosity: basic
  logging:
    verbosity: basic
processors:
  batch:
  # FD-1555: the same journey and criticality the services report, so the alerts match.
  resource/flagsmith:
    attributes:
      - key: service.name
        value: flagsmith
        action: upsert
      - key: journey.name
        value: feature_flags
        action: upsert
      - key: journey.criticality
        value: business-critical
        action: upsert
      - key: deployment.environment
        value: "${DEPLOYMENT_ENVIRONMENT}"
        action: upsert
extensions:
  health_check:
  pprof:
    endpoint: :1888
  zpages:
    endpoint: :55679
service:
  extensions: [pprof, zpages, health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/default]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/default]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/default]
    metrics/flagsmith:
      receivers: [httpcheck/flagsmith]
      processors: [resource/flagsmith, batch]
      exporters: [otlphttp/default]
